services:
  main-gw:
    build:
      context: primary-build
      args:
        IGNITION_VERSION: 8.1.48
    hostname: main-host
    container_name: demo-main
    ports:
      - 9050:8088
      - 1883:1883
    volumes:
      - demo-main-data:/usr/local/bin/ignition/data
     # - ./gw-init/gold_gw.gwbk:/restore.gwbk
     # - ./gw-init/gateway-uuid.txt:/usr/local/bin/ignition/data/.uuid
     # - ./gw-init/gateway-metro-keystore:/usr/local/bin/ignition/data/local/metro-keystore
    networks:
      - gw-network
      - secondary-network
    environment:
      - IGNITION_EDITION=standard
      - GATEWAY_ADMIN_PASSWORD=katlego
      - GATEWAY_MODULES_ENABLED=alarm-notification,enterprise-administration,opc-ua,perspective,reporting,sfc,sms-notification,sql-bridge,symbol-factory,tag-historian,voice-notification,web-developer
      - ACCEPT_IGNITION_EULA=Y
    labels:
      tsdproxy.enable: true
      tsdproxy.ephemeral: false
    restart: unless-stopped
    command: >
      -n main-gw
      -m 1024
   #   -r /restore.gwbk
  backup-gw:
    build:
      context: secondary-build
      args:
        IGNITION_VERSION: 8.1.48
    hostname: backup-host
    container_name: demo-backup
    ports:
      - 9051:8088
      - 1884:1883
    volumes:
      - demo-backup-data:/usr/local/bin/ignition/data
    #  - ./gw-init/secondary.gwbk:/restore.gwbk
    # - ./gw-init/secondary-uuid.txt:/usr/local/bin/ignition/data/.uuid
    # - ./gw-init/secondary-metro-keystore:/usr/local/bin/ignition/data/local/metro-keystore
    # - ./pylib/speciallibrary.py:/usr/local/bin/ignition/user-lib/pylib/speciallibrary.py
    labels:
      tsdproxy.enable: true
      tsdproxy.ephemeral: false
    restart: unless-stopped
    networks:
      - secondary-network
    environment:
      - IGNITION_EDITION=standard
      - GATEWAY_ADMIN_PASSWORD=katlego
      - ACCEPT_IGNITION_EULA=Y
      - GATEWAY_MODULES_ENABLED=alarm-notification,enterprise-administration,opc-ua,perspective,reporting,sfc,sms-notification,sql-bridge,symbol-factory,tag-historian,voice-notification,web-developer
    command: >
      -m 1024

networks:
  gw-network:
  secondary-network:
volumes:
  demo-main-data:
  demo-backup-data:

